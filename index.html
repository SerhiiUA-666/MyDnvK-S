<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Просто так не пройти</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/png" href="images/icon.png">
        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Pangolin&family=Comic+Neue:wght=400;700&display=swap');

    .staticrypt-hr {
        margin-top: 20px;
        margin-bottom: 20px;
        border: 0;
        border-top: 4px dashed #333; /* Стилизовали полоску под комикс */
    }

    .staticrypt-page {
        width: 100%;
        max-width: 420px;
        padding: 0;
        margin: auto;
        box-sizing: border-box;
    }

    /* --- КАРТОЧКА В СТИЛЕ КНИГИ --- */
    .staticrypt-form {
        position: relative;
        z-index: 1;
        background: #ff5757; /* Красная обложка */
        border: 8px solid #333; /* Жирная черная рамка */
        border-radius: 16px;
        margin: 0 auto;
        padding: 40px 25px 30px 25px;
        text-align: center;
        box-shadow: 0 15px 0px rgba(0, 0, 0, 0.2);
        transform: rotate(-2.5deg); /* Фирменный наклон */
    }

    /* Декоративная закладка/корешок сверху */
    .staticrypt-form::before {
        content: "🐾";
        position: absolute;
        top: -28px; left: 40px;
        font-size: 32px;
        background: #76e150; 
        border: 4px solid #333;
        border-radius: 12px;
        width: 50px; height: 50px;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 4px 0px #333;
        transform: rotate(5deg);
    }

    /* --- ПОЛЕ ВВОДА --- */
    .staticrypt-form input[type="password"],
    input[type="text"] {
        background: #fff;
        border: 4px solid #333;
        border-radius: 12px;
        box-sizing: border-box; 
        font-family: 'Comic Neue', cursive;
        font-weight: 700;
        font-size: 18px;
        outline: 0;
        padding: 14px 40px 14px 14px; /* Оставили место справа под иконку глазика */
        width: 100%;
        text-align: center;
        box-shadow: inset 0 4px 0 rgba(0,0,0,0.05);
        transition: all 0.2s;
    }

    .staticrypt-form input[type="password"]:focus,
    input[type="text"]:focus {
        background: #fffdf0;
        border-color: #ffde59;
    }

    .staticrypt-password-container {
        position: relative;
        outline: 0;
        background: transparent; /* Убрали серый фон оригинала */
        width: 100%;
        border: 0;
        margin: 0 0 20px;
        box-sizing: border-box;
    }

    .staticrypt-toggle-password-visibility {
        cursor: pointer;
        height: 24px;
        opacity: 0.8;
        padding: 0;
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        width: 24px;
        transition: opacity 0.2s;
    }
    .staticrypt-toggle-password-visibility:hover {
        opacity: 1;
    }

    /* --- КНОПКА ВОЙТИ --- */
    .staticrypt-form .staticrypt-decrypt-button {
        text-transform: uppercase;
        outline: 0;
        background: #57b9ff; /* Синяя кнопка */
        border: 4px solid #333;
        border-radius: 14px;
        width: 100%;
        padding: 14px;
        color: #ffffff;
        font-family: 'Pangolin', cursive;
        font-size: 22px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 6px 0px #333; 
        transition: all 0.1s ease;
    }

    .staticrypt-form .staticrypt-decrypt-button:active {
        box-shadow: 0 2px 0px #333;
        transform: translateY(4px);
    }

    .staticrypt-html {
        height: 100%;
    }

    /* --- ФОН СТРАНИЦЫ --- */
    .staticrypt-body {
        min-height: 100vh;
        margin: 0;
        background-color: #ffde59; 
        background-image: radial-gradient(#ffbd59 20%, transparent 20%);
        background-size: 30px 30px; 
        display: flex;
        flex-direction: column;
        font-family: 'Comic Neue', cursive;
    }

    .staticrypt-content {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        background: transparent; /* Убрали стандартный зеленый фон */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        padding: 20px;
    }

    .staticrypt-instructions {
        margin-top: 0;
        margin-bottom: 1em;
    }

    /* --- ТЕКСТЫ --- */
    .staticrypt-title {
        font-family: 'Pangolin', cursive;
        font-size: 38px;
        color: #fff;
        text-shadow: 4px 4px 0px #333; 
        margin: 0 0 5px 0;
        transform: rotate(-1.5deg);
    }

    .staticrypt-instructions p {
        color: #fff;
        font-weight: 700;
        font-size: 16px;
        text-shadow: 2px 2px 0px #333;
        margin: 0;
    }

    label.staticrypt-remember {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1em;
        color: #fff;
        font-weight: bold;
        text-shadow: 1px 1px 0px #333;
    }

    .staticrypt-remember input[type="checkbox"] {
        transform: scale(1.5);
        margin-right: 1em;
    }

    .hidden {
        display: none !important;
    }

    .staticrypt-spinner-container {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Стилизуем спиннер загрузки в цвет обложки */
    .staticrypt-spinner {
        display: inline-block;
        width: 3rem;
        height: 3rem;
        border: 6px solid #ff5757;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spinner-border 0.75s linear infinite;
    }

    @keyframes spinner-border {
        100% { transform: rotate(360deg); }
    }

    @media screen and (-webkit-min-device-pixel-ratio: 0) {
        .staticrypt-form input[type="password"],
        input[type="text"] {
            font-size: 18px;
        }
    }
</style>
</head>
