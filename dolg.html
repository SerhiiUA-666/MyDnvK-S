<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❄️ Админ панель - Запросы и возвраты</title>
    <link href="https://fonts.googleapis.com/css2?family=Pangolin&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at 10% 20%, #0b1a2e, #020810);
            min-height: 100vh;
            font-family: 'Comic Neue', cursive;
            padding: 20px;
            color: #e0f0ff;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #4fc3f7;
            padding-bottom: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 {
            font-family: 'Pangolin', cursive;
            color: #4fc3f7;
            text-shadow: 0 0 30px #4fc3f7;
            font-size: 36px;
        }
        .header .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .header .user-info span {
            color: #4fc3f7;
            font-size: 18px;
        }
        .logout-btn {
            background: rgba(255, 82, 82, 0.2);
            border: 2px solid #ff5252;
            border-radius: 30px;
            padding: 6px 20px;
            color: #ff5252;
            font-family: 'Pangolin', cursive;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .logout-btn:hover {
            background: rgba(255, 82, 82, 0.4);
            box-shadow: 0 0 25px #ff5252;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .stats .stat-card {
            background: rgba(8, 20, 40, 0.8);
            border: 2px solid #4fc3f7;
            border-radius: 16px;
            padding: 10px 25px;
            text-align: center;
        }
        .stats .stat-card .num {
            font-size: 28px;
            font-weight: bold;
            color: #4fc3f7;
        }
        .stats .stat-card .label {
            font-size: 14px;
            opacity: 0.7;
        }
        .section-title {
            font-family: 'Pangolin', cursive;
            font-size: 28px;
            color: #4fc3f7;
            text-shadow: 0 0 20px #4fc3f7;
            margin: 30px 0 15px 0;
            border-bottom: 2px solid #4fc3f7;
            padding-bottom: 8px;
        }
        .loan-list, .repayment-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .loan-card, .repayment-card {
            background: rgba(8, 20, 40, 0.9);
            border: 2px solid #4fc3f7;
            border-radius: 20px;
            padding: 18px 22px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            box-shadow: 0 0 30px rgba(79, 195, 247, 0.1);
            transition: 0.2s;
        }
        .loan-card:hover, .repayment-card:hover {
            border-color: #b388ff;
            box-shadow: 0 0 40px rgba(79, 195, 247, 0.2);
        }
        .loan-card .info, .repayment-card .info {
            flex: 2;
            min-width: 200px;
        }
        .loan-card .info .email, .repayment-card .info .email {
            font-weight: bold;
            color: #4fc3f7;
            font-size: 18px;
        }
        .loan-card .info .amount, .repayment-card .info .amount {
            font-size: 24px;
            color: #69f0ae;
            font-weight: bold;
        }
        .loan-card .info .comment, .repayment-card .info .comment {
            opacity: 0.8;
            margin-top: 4px;
        }
        .loan-card .info .timestamp, .repayment-card .info .timestamp {
            font-size: 12px;
            opacity: 0.5;
            margin-top: 4px;
        }
        .loan-card .status {
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            background: rgba(255, 193, 7, 0.2);
            color: #ffca28;
            border: 1px solid #ffca28;
        }
        .loan-card .status.approved {
            background: rgba(0, 230, 118, 0.2);
            color: #69f0ae;
            border-color: #69f0ae;
        }
        .loan-card .status.rejected {
            background: rgba(255, 82, 82, 0.2);
            color: #ff5252;
            border-color: #ff5252;
        }
        .loan-card .actions, .repayment-card .actions {
            display: flex;
            gap: 10px;
        }
        .loan-card .actions button {
            padding: 8px 20px;
            border-radius: 30px;
            border: none;
            font-family: 'Pangolin', cursive;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }
        .btn-approve {
            background: #4fc3f7;
            color: #0a1a2e;
            box-shadow: 0 0 20px rgba(79, 195, 247, 0.3);
        }
        .btn-approve:hover {
            background: #7cd4f8;
            transform: scale(1.02);
        }
        .btn-reject {
            background: rgba(255, 82, 82, 0.2);
            color: #ff5252;
            border: 2px solid #ff5252 !important;
        }
        .btn-reject:hover {
            background: rgba(255, 82, 82, 0.4);
        }
        .btn-approve:disabled, .btn-reject:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .empty-msg {
            text-align: center;
            font-size: 24px;
            color: #6a9fc7;
            padding: 50px 0;
        }
        .auth-box {
            max-width: 400px;
            margin: 100px auto;
            background: rgba(8, 20, 40, 0.9);
            border: 3px solid #4fc3f7;
            border-radius: 32px;
            padding: 40px 30px;
            text-align: center;
        }
        .auth-box h2 {
            color: #4fc3f7;
            font-family: 'Pangolin', cursive;
            margin-bottom: 20px;
        }
        .auth-box input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 12px;
            background: rgba(0, 10, 30, 0.6);
            border: 2px solid #4fc3f7;
            border-radius: 16px;
            color: #4fc3f7;
            font-family: 'Comic Neue', cursive;
            font-size: 18px;
            outline: none;
        }
        .auth-box .auth-error {
            color: #ff5252;
            margin-top: 8px;
            min-height: 24px;
        }
        .auth-box button {
            padding: 12px 30px;
            border-radius: 30px;
            border: none;
            background: #4fc3f7;
            color: #0a1a2e;
            font-family: 'Pangolin', cursive;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        .auth-box button:hover {
            background: #7cd4f8;
        }
        .auth-box .auth-remember {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #b0d4f0;
            margin: 12px 0;
        }
        .auth-box .auth-remember input {
            width: 20px;
            height: 20px;
            accent-color: #4fc3f7;
            cursor: pointer;
        }
        @media (max-width: 700px) {
            .loan-card, .repayment-card {
                flex-direction: column;
                align-items: stretch;
            }
            .loan-card .actions, .repayment-card .actions {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <!-- Шапка -->
    <div class="header" id="header" style="display: none;">
        <h1>❄️ Управление долгами</h1>
        <div class="user-info">
            <span id="admin-email">admin@example.com</span>
            <button class="logout-btn" onclick="logout()">🚪 Выйти</button>
        </div>
    </div>

    <!-- Статистика -->
    <div id="stats-area" style="display: none;">
        <div class="stats">
            <div class="stat-card"><div class="num" id="total-count">0</div><div class="label">Всего заявок</div></div>
            <div class="stat-card"><div class="num" id="pending-count">0</div><div class="label">Ожидают</div></div>
            <div class="stat-card"><div class="num" id="approved-count">0</div><div class="label">Одобрено</div></div>
            <div class="stat-card"><div class="num" id="rejected-count">0</div><div class="label">Отклонено</div></div>
            <div class="stat-card"><div class="num" id="repayment-count">0</div><div class="label">Всего возвратов</div></div>
            <div class="stat-card"><div class="num" id="repayment-total">0</div><div class="label">Общая сумма возврата</div></div>
        </div>
    </div>

    <!-- Заявки на получение долга -->
    <div id="loan-section" style="display: none;">
        <div class="section-title">📩 Заявки на получение</div>
        <div id="loan-list" class="loan-list"></div>
    </div>

    <!-- История возвратов -->
    <div id="repayment-section" style="display: none;">
        <div class="section-title">↩️ История возвратов</div>
        <div id="repayment-list" class="repayment-list"></div>
    </div>

    <!-- Авторизация -->
    <div id="auth-box" class="auth-box">
        <h2>❄️ Вход в админку</h2>
        <input type="email" id="admin-email-input" placeholder="Email" autocomplete="email">
        <input type="password" id="admin-password-input" placeholder="Пароль" autocomplete="current-password">
        <div class="auth-remember">
            <input type="checkbox" id="admin-remember" checked>
            <label for="admin-remember">Запомнить меня</label>
        </div>
        <div id="auth-error" class="auth-error"></div>
        <button onclick="adminLogin()">Войти</button>
    </div>
</div>

<script>
    // Firebase конфиг (такой же, как в основном казино)
    const firebaseConfig = {
        apiKey: "AIzaSyDzDfj9lkJG0NrRrsHN6AdBcHZRCdxmCCQ",
        authDomain: "kazik-fdb39.firebaseapp.com",
        databaseURL: "https://kazik-fdb39-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "kazik-fdb39",
        storageBucket: "kazik-fdb39.firebasestorage.app",
        messagingSenderId: "815176792573",
        appId: "1:815176792573:web:a90747c49f3186dc9d0194"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();

    // Список разрешённых админов (email'ы)
    const ADMIN_EMAILS = ['movie_best@serhii.com']; // замените на свои

    let currentUser = null;
    let loanRef = null;
    let repaymentRef = null;
    let allRequests = {};
    let allRepayments = {};

    // DOM
    const authBox = document.getElementById('auth-box');
    const header = document.getElementById('header');
    const statsArea = document.getElementById('stats-area');
    const loanList = document.getElementById('loan-list');
    const repaymentList = document.getElementById('repayment-list');
    const loanSection = document.getElementById('loan-section');
    const repaymentSection = document.getElementById('repayment-section');
    const adminEmailSpan = document.getElementById('admin-email');

    // Статистика
    const totalCountSpan = document.getElementById('total-count');
    const pendingCountSpan = document.getElementById('pending-count');
    const approvedCountSpan = document.getElementById('approved-count');
    const rejectedCountSpan = document.getElementById('rejected-count');
    const repaymentCountSpan = document.getElementById('repayment-count');
    const repaymentTotalSpan = document.getElementById('repayment-total');

    // Авторизация
    function adminLogin() {
        const email = document.getElementById('admin-email-input').value.trim();
        const password = document.getElementById('admin-password-input').value.trim();
        const remember = document.getElementById('admin-remember').checked;
        const errorEl = document.getElementById('auth-error');

        if (!email || !password) {
            errorEl.textContent = 'Заполните оба поля.';
            return;
        }
        errorEl.textContent = '';
        const persistence = remember ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION;
        auth.setPersistence(persistence).then(() => {
            return auth.signInWithEmailAndPassword(email, password);
        }).catch((error) => {
            errorEl.textContent = error.message;
        });
    }

    function logout() {
        auth.signOut().catch(console.error);
    }

    function isAdmin(user) {
        return user && ADMIN_EMAILS.includes(user.email);
    }

    // --- Подписка на заявки ---
    function subscribeToLoans() {
        if (loanRef) return;
        loanRef = database.ref('loanRequests');
        loanRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                allRequests = data;
                renderLoans(data);
                updateStats();
            } else {
                allRequests = {};
                loanList.innerHTML = '<div class="empty-msg">📭 Нет заявок</div>';
                updateStats();
            }
        });
    }

    // --- Подписка на возвраты ---
    function subscribeToRepayments() {
        if (repaymentRef) return;
        repaymentRef = database.ref('repayments');
        repaymentRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                allRepayments = data;
                renderRepayments(data);
                updateStats();
            } else {
                allRepayments = {};
                repaymentList.innerHTML = '<div class="empty-msg">📭 Нет возвратов</div>';
                updateStats();
            }
        });
    }

    // Обновление статистики (заявки + возвраты)
    function updateStats() {
        const loanValues = Object.values(allRequests);
        const total = loanValues.length;
        const pending = loanValues.filter(r => r.status === 'pending').length;
        const approved = loanValues.filter(r => r.status === 'approved').length;
        const rejected = loanValues.filter(r => r.status === 'rejected').length;
        totalCountSpan.textContent = total;
        pendingCountSpan.textContent = pending;
        approvedCountSpan.textContent = approved;
        rejectedCountSpan.textContent = rejected;

        // Возвраты
        const repaymentValues = Object.values(allRepayments);
        const repayCount = repaymentValues.length;
        const repaySum = repaymentValues.reduce((sum, r) => sum + (r.amount || 0), 0);
        repaymentCountSpan.textContent = repayCount;
        repaymentTotalSpan.textContent = repaySum;
    }

    // Рендер заявок
    function renderLoans(data) {
        const keys = Object.keys(data);
        if (keys.length === 0) {
            loanList.innerHTML = '<div class="empty-msg">📭 Нет заявок</div>';
            return;
        }
        keys.sort((a, b) => (data[b].timestamp || 0) - (data[a].timestamp || 0));

        let html = '';
        keys.forEach(key => {
            const req = data[key];
            const status = req.status || 'pending';
            const timestamp = req.timestamp ? new Date(req.timestamp).toLocaleString() : 'неизвестно';
            const isPending = status === 'pending';
            html += `
                <div class="loan-card" data-id="${key}">
                    <div class="info">
                        <div class="email">${req.email || 'неизвестно'}</div>
                        <div class="amount">${req.amount || 0} 🪙</div>
                        <div class="comment">${req.comment || ''}</div>
                        <div class="timestamp">${timestamp}</div>
                    </div>
                    <div class="status ${status}">${status === 'pending' ? '⏳ Ожидает' : status === 'approved' ? '✅ Одобрено' : '❌ Отклонено'}</div>
                    <div class="actions">
                        ${isPending ? `
                            <button class="btn-approve" onclick="approveLoan('${key}')">✅ Одобрить</button>
                            <button class="btn-reject" onclick="rejectLoan('${key}')">❌ Отклонить</button>
                        ` : `
                            <span style="opacity:0.5;font-size:14px;">Обработано</span>
                        `}
                    </div>
                </div>
            `;
        });
        loanList.innerHTML = html;
    }

    // Рендер возвратов
    function renderRepayments(data) {
        const keys = Object.keys(data);
        if (keys.length === 0) {
            repaymentList.innerHTML = '<div class="empty-msg">📭 Нет возвратов</div>';
            return;
        }
        keys.sort((a, b) => (data[b].timestamp || 0) - (data[a].timestamp || 0));

        let html = '';
        keys.forEach(key => {
            const rep = data[key];
            const timestamp = rep.timestamp ? new Date(rep.timestamp).toLocaleString() : 'неизвестно';
            html += `
                <div class="repayment-card" data-id="${key}">
                    <div class="info">
                        <div class="email">${rep.email || 'неизвестно'}</div>
                        <div class="amount">${rep.amount || 0} 🪙</div>
                        <div class="comment">${rep.comment || ''}</div>
                        <div class="timestamp">${timestamp}</div>
                    </div>
                    <div class="actions">
                        <span style="opacity:0.6;font-size:14px;">💳 Возврат</span>
                    </div>
                </div>
            `;
        });
        repaymentList.innerHTML = html;
    }

    // Одобрение заявки
    async function approveLoan(key) {
        const req = allRequests[key];
        if (!req || req.status !== 'pending') return;
        const btn = document.querySelector(`.loan-card[data-id="${key}"] .btn-approve`);
        if (btn) btn.disabled = true;

        try {
            await database.ref('loanRequests/' + key).update({ status: 'approved' });
            const userId = req.userId;
            if (userId && req.amount) {
                const userRef = database.ref('users/' + userId + '/gameData/balance');
                await userRef.transaction((currentBalance) => {
                    if (currentBalance === null) return req.amount;
                    return currentBalance + req.amount;
                });
            }
        } catch (error) {
            console.error('Ошибка одобрения:', error);
            if (btn) btn.disabled = false;
            alert('Ошибка: ' + error.message);
        }
    }

    // Отклонение заявки
    async function rejectLoan(key) {
        const req = allRequests[key];
        if (!req || req.status !== 'pending') return;
        const btn = document.querySelector(`.loan-card[data-id="${key}"] .btn-reject`);
        if (btn) btn.disabled = true;

        try {
            await database.ref('loanRequests/' + key).update({ status: 'rejected' });
        } catch (error) {
            console.error('Ошибка отклонения:', error);
            if (btn) btn.disabled = false;
            alert('Ошибка: ' + error.message);
        }
    }

    // Обработчик авторизации
    auth.onAuthStateChanged((user) => {
        if (user && isAdmin(user)) {
            currentUser = user;
            authBox.style.display = 'none';
            header.style.display = 'flex';
            statsArea.style.display = 'block';
            loanSection.style.display = 'block';
            repaymentSection.style.display = 'block';
            adminEmailSpan.textContent = user.email;
            subscribeToLoans();
            subscribeToRepayments();
        } else {
            currentUser = null;
            authBox.style.display = 'block';
            header.style.display = 'none';
            statsArea.style.display = 'none';
            loanSection.style.display = 'none';
            repaymentSection.style.display = 'none';
            loanList.innerHTML = '';
            repaymentList.innerHTML = '';
            if (loanRef) {
                loanRef.off();
                loanRef = null;
            }
            if (repaymentRef) {
                repaymentRef.off();
                repaymentRef = null;
            }
            if (user) {
                document.getElementById('auth-error').textContent = 'У вас нет прав администратора.';
            } else {
                document.getElementById('auth-error').textContent = '';
            }
        }
    });

    // Обработка Enter
    document.getElementById('admin-password-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') adminLogin();
    });
    document.getElementById('admin-email-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') adminLogin();
    });
</script>
</body>
</html>
